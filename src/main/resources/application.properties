spring.application.name=ScholarTrack
server.port=8080

# MySQL Database Configuration (XAMPP default settings)
spring.datasource.url=jdbc:mysql://localhost:3306/scholartrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
