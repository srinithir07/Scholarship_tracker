spring.application.name=scholartrack
server.port=8080

# ---- MySQL (XAMPP) ----------------------------------------------------------
# Every value can be overridden with an environment variable, e.g. DB_PASSWORD.
# The database is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:scholartrack}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=karunya@08

# ---- JPA / Hibernate --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- JSON -------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Sample data ------------------------------------------------------------
# Seeds demo data on first start only (skipped when students/schemes already exist).
scholartrack.seed.enabled=${SEED_SAMPLE_DATA:true}
